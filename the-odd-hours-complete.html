<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050607" />
    <meta name="description" content="The Odd Hours" />
    <title>The Odd Hours</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { min-height: 100%; margin: 0; background: #050607; }
      body { overflow: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      .hero { position: relative; display: grid; min-height: 100vh; min-height: 100svh; min-height: 100dvh; place-items: center; overflow: hidden; padding: max(24px, env(safe-area-inset-top, 0px)) 24px max(24px, env(safe-area-inset-bottom, 0px)); color: #fff; }
      .background-video { position: absolute; z-index: 0; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1); }
      .shade { position: absolute; z-index: 1; inset: 0; background: rgba(0, 0, 0, .32); }
      h1 { position: relative; z-index: 2; margin: 0; color: #fff; font: 500 clamp(3.4rem, 8.2vw, 7rem)/.82 "Bodoni Moda", Georgia, serif; letter-spacing: -.1em; text-align: center; text-shadow: 0 3px 30px rgba(0,0,0,.45); }
      .title-the { display: block; margin: 0 0 .35em; font: 500 clamp(.65rem, 1.4vw, 1rem)/1 "DM Mono", monospace; letter-spacing: .22em; text-transform: uppercase; opacity: 0; animation: fade-in .2s .1s ease forwards; }
      .title-line { display: block; width: max-content; max-width: 100%; margin: 0 auto; padding-right: .12em; white-space: nowrap; clip-path: inset(0 100% 0 0); }
      .title-odd { animation: type-on .55s .32s steps(3, end) forwards; }
      .title-hours { animation: type-on .78s .95s steps(5, end) forwards; }
      .next { position: absolute; z-index: 2; bottom: max(24px, calc(18px + env(safe-area-inset-bottom, 0px))); left: 50%; display: inline-flex; align-items: center; justify-content: space-between; gap: 19px; min-width: 112px; min-height: 44px; padding: 13px 16px 13px 19px; transform: translateX(-50%); border: 1px solid rgba(255,255,255,.7); border-radius: 999px; color: #fff; font: 11px/1 "DM Mono", monospace; letter-spacing: .1em; text-decoration: none; text-transform: uppercase; transition: background .2s ease, color .2s ease, transform .2s ease; }
      .next:hover { background: #fff; color: #050607; transform: translateX(-50%) translateY(-3px); }
      .next span { font: 18px/10px Arial, sans-serif; }
      .next-template { display: none; min-height: 100vh; min-height: 100svh; min-height: 100dvh; background: #050607; }
      body.show-next .hero { display: none; }
      body.show-next .next-template { display: block; }
      @keyframes type-on { to { clip-path: inset(0 0 0 0); } }
      @keyframes fade-in { to { opacity: 1; } }
      @media (max-width: 760px) {
        h1 { font-size: clamp(3rem, 16vw, 5rem); }
        .next { min-width: 106px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .title-the { opacity: 1; animation: none; }
        .title-line { clip-path: none; animation: none; }
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <video class="background-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true">
        <source src="https://www.thevertex.sbs/assets/vertex-background.mp4" type="video/mp4" />
      </video>
      <div class="shade" aria-hidden="true"></div>
      <h1>
        <span class="title-the">The</span>
        <span class="title-line title-odd">Odd</span>
        <span class="title-line title-hours">Hours</span>
      </h1>
      <a id="next-link" class="next" href="#next-template">Next <span>→</span></a>
    </main>
    <section id="next-template" class="next-template" aria-label="Blank next template"></section>
    <script>
      const showTemplate = () => document.body.classList.add('show-next');
      const hideTemplate = () => document.body.classList.remove('show-next');

      document.querySelector('#next-link').addEventListener('click', showTemplate);
      window.addEventListener('hashchange', () => {
        if (window.location.hash === '#next-template') showTemplate();
        else hideTemplate();
      });

      if (window.location.hash === '#next-template') showTemplate();
    </script>
  </body>
</html>
